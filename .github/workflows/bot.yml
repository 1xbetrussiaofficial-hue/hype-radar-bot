name: HypeRadarBot

on:
  schedule:
    - cron: '*/5 * * * *'   # toutes les 5 minutes (repo PRIVÉ : mets '*/30 * * * *')
  workflow_dispatch:

permissions:
  contents: write   # nécessaire pour sauvegarder seen.json (anti-doublons)

concurrency:
  group: hyperadar
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python bot.py

      - name: Save seen.json
        if: always()
        run: |
          git config user.name "hyperadar-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "update seen.json" && git pull --rebase && git push)
